services:
  # Backend Web Service
  - type: web
    name: workhub-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: workhub-db
          property: connectionString

  # Frontend Static Site
  - type: web
    name: workhub-frontend
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: workhub-backend
          property: host

databases:
  # Managed PostgreSQL Database
  - name: workhub-db
    databaseName: workhub_db
    user: workhub_user
    plan: free
    region: oregon

version: '3.8'

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: jobtrack_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobtrack_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobtrack_password}
      POSTGRES_DB: ${POSTGRES_DB:-jobtrack_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtrack_user -d jobtrack_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Express + Prisma Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobtrack_backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://jobtrack_user:jobtrack_password@postgres:5432/jobtrack_db?schema=public
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_jobtrack_production_2026}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:5173
      MAX_FILE_SIZE_MB: 10
    ports:
      - "5000:5000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  # React + Vite Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jobtrack_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:

name: WorkHub CI / CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Lint, Typecheck & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install All Workspace Dependencies
        run: npm ci

      - name: Generate Backend Prisma Client
        run: npm --prefix backend run prisma:generate

      - name: Typecheck Backend
        run: npm --prefix backend run build

      - name: Ensure Linux Native Binaries for Vite / Rollup
        run: npm --prefix frontend install @rollup/rollup-linux-x64-gnu --no-save

      - name: Build Frontend Production Bundle
        run: npm --prefix frontend run build

